[project]
name = "retake"
version = "1.0.0"
description = "Audit robot-learning (LeRobot) datasets for bad demonstrations: integrity checks, Nemotron vision, cited fix guidance"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "huggingface-hub>=2.3.0",
    "markdown>=3.11.2",
    "numpy>=2.4.6",
    "openai>=3.40.0",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "tavily-python>=0.8.5",
]

[project.scripts]
retake = "retake.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retake"]
